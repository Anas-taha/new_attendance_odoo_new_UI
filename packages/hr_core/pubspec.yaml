name: hr_core
description: Shared HR attendance Odoo UI, services, and routing for white-label apps.
version: 1.0.2
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  path: ^1.9.0
  camera: ^0.12.0+1
  permission_handler: ^12.0.1
  get: ^4.7.3
  image: ^4.1.7
  flutter_svg: ^2.2.4
  path_provider: ^2.1.5
  flutter_image_compress: ^2.1.0
  image_picker: ^1.2.2
  flutter_screenutil: ^5.9.3
  table_calendar: ^3.2.0
  skeletonizer: ^2.1.3
  dropdown_button2: ^3.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  local_auth: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
