name: Monorepo CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  analyze-hr-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze hr_core
        run: |
          cd packages/hr_core
          flutter pub get
          flutter analyze

  build-android-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [bluehr, alshalawi, smartfitness]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build ${{ matrix.app }} APK
        run: |
          cd apps/${{ matrix.app }}
          flutter pub get
          flutter analyze
          flutter build apk --release

  build-ios-matrix:
    runs-on: macos-latest
    strategy:
      matrix:
        app: [bluehr, alshalawi, smartfitness]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build ${{ matrix.app }} iOS (no codesign)
        run: |
          cd apps/${{ matrix.app }}
          flutter pub get
          flutter analyze
          flutter build ios --release --no-codesign
