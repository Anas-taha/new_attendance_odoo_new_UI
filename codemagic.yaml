workflows:
  hr-core-analyze:
    name: hr_core analyze
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Analyze shared package
        script: |
          cd packages/hr_core
          flutter pub get
          flutter analyze

  android-matrix:
    name: Android release matrix
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Build all company AABs
        script: |
          for app in bluehr alshalawi smartfitness; do
            echo "Building apps/$app"
            cd apps/$app
            flutter pub get
            flutter analyze
            flutter build appbundle --release
            cd ../..
          done
    artifacts:
      - apps/*/build/app/outputs/bundle/release/*.aab

  ios-app-example:
    name: iOS example (bluehr)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "com.bluehr.hr" --type IOS_APP_STORE --create
      - name: Add certificates
        script: keychain add-certificates
      - name: Install pods
        script: |
          cd apps/bluehr/ios
          pod install
      - name: Analyze and build IPA
        script: |
          cd apps/bluehr
          flutter pub get
          flutter analyze
          flutter build ipa --release
    artifacts:
      - apps/bluehr/build/ios/ipa/*.ipa
